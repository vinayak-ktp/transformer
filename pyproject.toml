[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "transformer"
version = "0.1.0"
description = "From-scratch Transformer for English to Hinglish translation"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "tqdm",
    "pyyaml",
    "sentencepiece",
    "sacrebleu",
    "datasets",
]

[project.optional-dependencies]
cpu = ["torch"]
cu121 = ["torch"]

[dependency-groups]
dev = ["pytest"]

[tool.hatch.build.targets.wheel]
packages = ["src", "scripts"]
dev-mode-dirs = ["."]

[tool.uv]
conflicts = [
    [
        { extra = "cpu" },
        { extra = "cu121" },
    ],
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu121", extra = "cu121", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true
